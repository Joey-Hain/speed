name: Test

on:
  push:
    branches: [main]
    paths: ["collector/**", "tests/**", "requirements.txt"]
  pull_request:

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tests.test_synthetic
      - run: python -m tests.test_metro
      - run: python -m tests.test_delta
      - run: python -m tests.test_metronet
      - run: python -m tests.test_fixes
      - run: python -m tests.test_extend

name: Collect speeds

# Starts hourly and polls for ~50 minutes, so collection is close to continuous.
# GitHub can start scheduled runs late (or drop one when busy); the concurrency
# group queues overlapping runs instead of running two collectors at once.
on:
  schedule:
    - cron: "7 * * * *"   # backup; runs chain themselves (see the last step)
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to poll"
        default: "50"
      feeds:
        description: "Comma-separated feed keys (blank = all)"
        default: ""
      rebuild:
        description: "feed:line to rebuild geometry for, e.g. sydneytrains:T1 (drops its totals)"
        default: ""
      refresh:
        description: "Re-download static GTFS (yes/no)"
        default: "no"
      chain:
        description: "Start the next run when this one finishes (yes/no)"
        default: "yes"

permissions:
  contents: write
  actions: write   # to start the next run

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Day stamp for the static GTFS cache
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Static GTFS cache
        uses: actions/cache@v4
        with:
          path: gtfs_cache
          key: gtfs-${{ steps.day.outputs.day }}
          restore-keys: gtfs-

      - name: Fetch current data
        env:
          TOKEN: ${{ github.token }}
        run: |
          if ! git clone -q --depth 1 --branch data \
              "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" store; then
            echo "No data branch yet, starting fresh"
            mkdir -p store
            git -C store init -q -b data
          fi

      - name: Collect
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
          MINUTES: ${{ github.event.inputs.minutes || '50' }}
          FEEDS: ${{ github.event.inputs.feeds }}
          REBUILD: ${{ github.event.inputs.rebuild }}
          REFRESH: ${{ github.event.inputs.refresh }}
        run: |
          args=(--minutes "$MINUTES" --store store --cache gtfs_cache)
          [ -n "$FEEDS" ] && args+=(--feeds "$FEEDS")
          [ -n "$REBUILD" ] && args+=(--rebuild "$REBUILD")
          [ "$REFRESH" = "yes" ] && args+=(--refresh-static)
          python -m collector.collect "${args[@]}" | tee summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The data branch is kept as a single commit that is replaced every run.
      # Totals cover a rolling ~30 days, so history isn't needed. Amending the
      # fetched commit means each push only uploads the files that changed.
      - name: Publish data branch
        if: success() || failure()
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -f store/index.json ] || { echo "nothing to publish"; exit 0; }
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          msg="Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          if git rev-parse -q --verify HEAD >/dev/null; then
            git commit -q --amend --reset-author -m "$msg"
          else
            git commit -q -m "$msg"
          fi
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data

      # GitHub's hourly schedule is unreliable (it can lag hours, and on new
      # repos may not fire at all), so each full-length run starts the next one.
      # A workflow_dispatch from GITHUB_TOKEN is allowed to start a new run; the
      # concurrency group keeps it to one at a time. Short test runs don't chain.
      - name: Start next run
        if: always() && (github.event_name == 'schedule' || (github.event.inputs.chain != 'no' && github.event.inputs.feeds == '' && fromJSON(github.event.inputs.minutes || '50') >= 30))
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main
